name: Deploy Interactive Lean 4 Proof Blueprint (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Static Research Portal & 56-Theorem Proof Blueprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Verify Static Proof Blueprint Portal
        run: |
          python3 scripts/build_blueprint.py
          python3 scripts/check_blueprint.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
