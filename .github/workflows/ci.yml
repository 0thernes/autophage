name: AUTOPHAGE v1.5.0 CI (Cross-Platform C11, Sanitizers, 6-Kernel Lean 4.35, Paper & Security)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  c11-linux:
    name: Linux C11 (-Werror, 19 Gates, 6 Mutants, ASan/UBSan, Blueprint & Timestamps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify SHA-256 Integrity Manifests (CHECKSUMS.sha256 & data/MANIFEST.sha256)
        run: |
          set -euo pipefail
          sha256sum -c CHECKSUMS.sha256
          sha256sum -c data/MANIFEST.sha256
      - name: Compile C11 Engine (-Wall -Wextra -Werror) & Run 19-Gate Falsification Suite
        run: |
          set -euo pipefail
          AUTOPHAGE_CI_PORTABLE=1 bash build_linux.sh
      - name: Run AddressSanitizer + UndefinedBehaviorSanitizer (-fsanitize=address,undefined)
        run: |
          set -euo pipefail
          AUTOPHAGE_CI_PORTABLE=1 AUTOPHAGE_SANITIZE=1 bash build_linux.sh
      - name: Run Dual-Kernel Parity Benchmark, Property, Axiom, Blueprint & Timestamp Checks
        run: |
          set -euo pipefail
          ./bin/autophage_linux bench --epochs 200 --size 32
          python3 scripts/prop_check.py
          python3 scripts/check_readme_axioms.py
          python3 scripts/check_blueprint.py
          python3 scripts/check_citations.py --offline
          python3 scripts/stamp_timestamps.py --verify
          node --check web/server.mjs
          node --check web/app.js

  c11-windows:
    name: Windows C11 (GCC -Werror, 19 Gates, 6 Mutants, prop_check & Blueprint)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile C11 Engine (Portable Win64 GCC) & Run 19-Gate Suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path bin, results | Out-Null
          $core = @("src/hw_isa.c","src/galois_math.c","src/jit_x86_64.c","src/soup_engine.c","src/metrology_ovbs.c","src/abi_exports.c")
          $flags = @("-O3","-Wall","-Wextra","-Werror","-Wno-unused-parameter","-DAUTOPHAGE_CI_PORTABLE","-DAUTOPHAGE_BARE_WIN64","-ffp-contract=off","-Iinclude")
          gcc @flags @core src/main_cli.c -o bin/autophage.exe -lm
          gcc @flags @core test/test_falsification.c -o bin/test_falsification.exe -lm
          Push-Location bin
          .\test_falsification.exe
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { exit $rc }
          python scripts/prop_check.py
          python scripts/check_readme_axioms.py
          python scripts/check_blueprint.py
          python scripts/stamp_timestamps.py --verify
          node --check web/server.mjs
          node --check web/app.js

  lean-6kernel:
    name: Pure Lean 4.35.0 — 56 Theorems, 6-Kernel Palomar Comparator & Negative Tamper Rejection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bubblewrap for Palomar multi-kernel sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install elan & pinned Lean 4.35.0 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build AutophageProofs, AdversarialTests, Solution & Challenge + Audit All 56 Axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build
          lake build Challenge
          lake env lean VerifyAxioms.lean > /tmp/lean4-audit.txt
          cat /tmp/lean4-audit.txt
          COUNT=$(grep -cE "depends on axioms:|does not depend on any axioms" /tmp/lean4-audit.txt)
          echo "Audited theorem count: $COUNT"
          test "$COUNT" -eq 56
          if grep -E "sorryAx|ofReduceBool|trustCompiler|_native" /tmp/lean4-audit.txt; then
            echo "FORBIDDEN AXIOM DETECTED" >&2
            exit 1
          fi
      - name: Run Live Negative Elaboration & Axiom-Tamper Rejection Harness
        run: |
          set -euo pipefail
          python3 scripts/test_lean_negative.py
      - name: Run 6-Kernel Palomar Checkers & Bubblewrap Challenge/Solution Comparator
        working-directory: lean
        run: |
          set -euo pipefail
          lake env leanchecker --fresh Solution
          lake env leanchecker-paranoid --fresh Solution
          lake check --paranoid
          lake comparator --config comparator.json --paranoid

  paper-pdf:
    name: AMS-LaTeX White Paper, Clean-Room arXiv & SLSA Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic
      - name: Compile paper/main.tex & Verify Clean-Room arXiv Tarball
        run: |
          set -euo pipefail
          python3 scripts/build_paper.py
          ls -lh dist/Donahue_2026_autophage.pdf dist/arxiv_submission.tar.gz
      - name: Generate CI SHA256SUMS
        run: |
          set -euo pipefail
          sha256sum dist/Donahue_2026_autophage.pdf dist/arxiv_submission.tar.gz results/lean4-audit.txt results/lean4-multi-kernel.txt results/citation-audit.json results/07_castration_ablation_13vec.csv > SHA256SUMS
          cat SHA256SUMS
      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: |
            dist/Donahue_2026_autophage.pdf
            dist/arxiv_submission.tar.gz
            SHA256SUMS

  audit-and-security:
    name: Build Standard v1.2.0 Audit & Report-Only Security / Static Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Build Standard v1.2.0 self-audit (report-only)
        continue-on-error: true
        run: bash scripts/audit-repo.sh .
      - name: Static analysis with cppcheck (report-only)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          cppcheck --enable=warning --suppress=missingIncludeSystem -Iinclude src/ test/
      - name: Secret scan via gitleaks (report-only)
        continue-on-error: true
        run: |
          GITLEAKS_VER="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact
