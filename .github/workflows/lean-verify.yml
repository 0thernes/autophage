name: AUTOPHAGE v1.3.0 Lean 4 & Linux C11 Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan & Lean 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify AutophageProofs.lean (42 pure-kernel theorems, strict axiom allowlist)
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lean AutophageProofs.lean 2>&1 | tee lean-ci-audit.log
          python3 - lean-ci-audit.log <<'PY'
          import re, sys
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          forbidden = re.compile(
              r"(warning|error|sorryAx|declaration uses 'sorry'|bv_decide|native_decide|ofReduceBool|trustCompiler)",
              re.I,
          )
          audited = 0
          with open(sys.argv[1], "r", encoding="utf-8") as f:
              for raw in f:
                  line = raw.strip()
                  if not line:
                      continue
                  if forbidden.search(line):
                      sys.exit(f"ERROR: Lean kernel integrity violation: {line}")
                  if re.match(r"^'([^']+)' does not depend on any axioms$", line):
                      audited += 1
                      continue
                  m = re.match(r"^'([^']+)' depends on axioms: \[([^\]]*)\]$", line)
                  if m:
                      axs = [a.strip() for a in m.group(2).split(",") if a.strip()]
                      bad = [a for a in axs if a not in allowed]
                      if bad:
                          sys.exit(f"ERROR: Forbidden axioms {bad} on {m.group(1)}")
                      audited += 1
                      continue
                  sys.exit(f"ERROR: Unexpected Lean output line: {line}")
          if audited < 42:
              sys.exit(f"ERROR: Expected >= 42 audited theorems, found {audited}")
          print(f"PASS: All {audited} AutophageProofs theorems verified strictly within {sorted(allowed)} (0 warnings, 0 sorry, 0 external SAT/compiler axioms).")
          PY

  linux-c11-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C11 Engine (-Wall -Wextra -Werror) & Run 18-Gate Falsification Suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin results
          CORE="src/hw_isa.c src/galois_math.c src/jit_x86_64.c src/soup_engine.c src/metrology_ovbs.c src/abi_exports.c"
          FLAGS="-O3 -Wall -Wextra -Werror -Wno-unused-parameter -march=native -DAUTOPHAGE_CI_PORTABLE -Iinclude"
          gcc $FLAGS $CORE src/main_cli.c -o bin/autophage_linux -lm
          gcc $FLAGS $CORE test/test_falsification.c -o bin/test_falsification_linux -lm
          (cd bin && ./test_falsification_linux)
          node --check web/server.mjs
          node --check web/app.js
