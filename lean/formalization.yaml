project:
  name: "AUTOPHAGE Formal Verification Suite (AutophageProofs)"
  description: >-
    Zero-Mathlib Pure Lean 4.35.0 formalization of 48 audited theorems (42 core
    algebraic, ledger, JIT-guard, Philox-isolation, OEE, and Weismann theorems
    plus 6 concrete non-vacuity witnesses and sharp negative-boundary
    refutations) about Lean models of the AUTOPHAGE bare-metal polymorphic
    x86-64 Galois-field genetic engine. Six of the 48 (T21, T23, T24, T28, T29,
    T30) are one-line arithmetic or XOR identities.
  authors:
