  description: >-
    Zero-Mathlib Pure Lean 4.35.0 formalization of 56 audited declarations (42 core
    algebraic, ledger, JIT-guard, Philox-isolation, OEE, and Weismann theorems
    including upgraded multi-step ledger heat-sink monotonicity T30, plus 6 concrete
    non-vacuity witnesses and boundary refutations T43-T48, plus 8 AdversarialTests.lean
    false-variant refutations AT01-AT08) about the Lean models in Spec.lean (not emitted
    x86-64 machine code). Five declarations (T21, T23, T24, T28, T29) are elementary
    arithmetic or XOR helper lemmas.
