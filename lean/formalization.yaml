status:
  scope: >-
    Certifies exact bitvector and integer invariants for Intel VGF2P8AFFINEQB
    F_2^(8x8) ribosome linear/affine inversion and elementary GL(8,2) row operations;
    GF(2)[x] carry-less multiplication (PCLMULQDQ), exact count of 30 degree-8
    polynomials passing a trial-division irreducibility test (all divisors of
    degree 1-4) and matching C11 GF2_IRRED_POLY8[30], Dobzhansky-Muller zero
    divisors, and 2x2 Cauchy MDS recovery in each of those 30 GF(2^8) fields;
    64-bit Toffoli/Fredkin involutions and exact Fredkin popcnt64 Hamming-weight
    conservation (with AT01 refuting Toffoli popcount conservation); exact 32-bit
    tzcnt32 2-adic Strong Triangle Inequality; arithmetic bounds of the JIT
    byte/qword masks and gas decrement (emission not proved); multi-step 5-pool
    integer ledger zero residual (T29a) and radiated-heat sink monotonicity +
    zero-alive oviGate (T30, over LedgerState/applyTransfers, not physical
    calorimetry); Philox 8-tuple domain disjointness, 3-tier seed firewall, OEE
    archive monotonicity, Weismann soma-only germline isolation, 6 concrete
    non-vacuity/boundary theorems (T43-T48), and 8 AdversarialTests.lean false-variant
    refutations (AT01-AT08). Five declarations (T21, T23, T24, T28, T29) are elementary
    arithmetic/XOR helpers. Explicitly NOT formalized inside Lean: raw x86-64
    machine-code emission encodings (verified bit-exact against scalar reference
    oracle in Gates T04 and T09 and 1,000,000-execution canary fuzzing in Gate T05),
    IEEE-754 Kahan-Neumaier floating-point drift (verified empirically in Gate T07),
    C11 memory safety (verified via ASan/UBSan + Gate T19), or any open scientific
    conjecture in the Unsolved Problems Mega-Atlas (0/1,900 retired).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
