fidelity:
  divergences: >-
    Lean 4.35.0 verifies exact BitVec/Int mathematical models of GFNI, PCLMULQDQ,
    Cauchy MDS, Toffoli/Fredkin, TZCNT, JIT mask bounds, gas decrement, 5-pool integer
    conservation & heat-sink monotonicity, Philox 8-tuple keys, seed bands, OEE archive,
    Weismann isolation, and 8 false-variant refutations (AT01-AT08). Raw x86-64
    instruction byte emission, SIMD intrinsics, IEEE-754 Kahan-Neumaier summation,
    C11 memory safety, and full-world evolutionary dynamics are verified differentially
    and empirically in C11 (`test/test_falsification.c`, Gates T01-T19 + 6 planted mutants).
    See `docs/statement-fidelity.md` for the complete row-by-row fidelity matrix.

review:
  status: "self-assessed"
  notes: >-
    Not externally peer-reviewed. Machine-checked locally on Windows by the Lean 4.35.0
    reference kernel (lean4, leanchecker --fresh, leanchecker-paranoid --fresh) plus
    3 independent Rust checkers (nanoda_bin, con-leche --verified, con-ron --verified),
    and verified across all 6 Palomar checkers (+ lean4lean + lake check --paranoid +
    lake comparator --paranoid) plus scripts/test_lean_negative.py on Ubuntu Linux
    with bubblewrap in `.github/workflows/ci.yml`.
