    plus 5 Windows-capable independent checkers (leanchecker --fresh,
    leanchecker-paranoid --fresh, con-leche --verified, con-ron --verified,
    nanoda_bin) and wired for all
    6/6 kernels (+ lean4lean + lake check --paranoid + lake comparator --paranoid)
    on Ubuntu Linux with bubblewrap in `.github/workflows/ci.yml`.
