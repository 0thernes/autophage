      framework: "Antigravity"
      notes: >-
        Assisted with Lean 4.35.0 Palomar module refactoring, non-vacuity and
        negative-boundary proof engineering, C11/fuzzer/CI hardening, Build Standard
        v1.2.0 scaffolding, and AMS-LaTeX white-paper drafting under human direction
        and multi-kernel verification.

fidelity:
  divergences: >-
    Lean 4.35.0 verifies exact BitVec/Int mathematical models of GFNI, PCLMULQDQ,
    Cauchy MDS, Toffoli/Fredkin, TZCNT, JIT mask bounds, gas halting, 5-pool integer
    conservation, Philox 8-tuple keys, seed bands, OEE archive, and Weismann isolation.
    Raw x86-64 instruction byte emission, SIMD intrinsics, IEEE-754 Kahan-Neumaier
    summation, and full-world evolutionary dynamics are verified differentially and
    empirically in C11 (`test/test_falsification.c`, Gates T01-T18 + 6 planted mutants).
    See `docs/statement-fidelity.md` for the complete row-by-row fidelity matrix.

review:
